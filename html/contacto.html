<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - JJSM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="menu container">
            <a href="index.html" class="logo">JJSM</a>
        </div>
    </header>

    <main class="container">
        <h2>Contáctanos</h2>
        <form action="ContactoServlet" method="get">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre completo">

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com">

            <label for="consulta">¿Qué deseas consultar?</label>
            <select id="consulta" name="consulta">
                <option value="precio">Precios</option>
                <option value="envio">Envíos</option>
                <option value="garantia">Garantía</option>
                <option value="tecnico">Soporte técnico</option>
            </select>

            <button type="submit">Consultar</button>
        </form>
    </main>
</body>
</html>
