
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - JJSM Impresoras 3D</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .form-container {
            max-width: 500px;
            margin: 60px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            padding: 40px 36px;
        }
        .form-container h2 {
            text-align: center;
            color: #1a3a5c;
            margin-bottom: 28px;
            font-size: 1.6rem;
        }
        .form-group {
            margin-bottom: 18px;
        }
        form-group label {
            display: block;
            font-weight: 600;
            color: #1a3a5c;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }
        .form-group input,
         .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #b0c4d8;
            border-radius: 7px;
            font-size: 0.97rem;
            transition: border 0.2s;
            box-sizing: border-box;
            background: #f4f8fb;
        }
        .form-group input:focus,
         .form-group select:focus {
            border-color: #2e75b6;
            outline: none;
            background: #fff;
        }
        .btn-registro {
            width: 100%;
            padding: 12px;
            background: #1a3a5c;
            color: #fff;
            border: none;
            border-radius: 7px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        .btn-registro:hover {
            background: #2e75b6;
        }
        .login-link {
            text-align: center;
            margin-top: 18px;
            font-size: 0.93rem;
            color: #555;
        }
        .login-link a {
            color: #2e75b6;
            font-weight: 600;
            text-decoration: none;
        }
        .login-link a:hover {
            text-decoration: underline;
        }.error-msg {
            color: #c00;
            font-size: 0.85rem;
            margin-top: 4px;
            display: none;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="menu container">
            <a href="index.html" class="logo">JJSM</a>
            <nav class="navbar">
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="catalogo.html">Catalogo</a></li>
                    <li><a href="solicitud.html">Solicitudes</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                    <li><a href="registro.html">Registro</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main> 
        <div class="form-container">
            <h2>Crear cuenta</h2>

            <form action="../java/RegistroServlet" method="post" onsubmit="return validarFormulario()"></form>"
            
                <div class="form-group">
                    <label for="nombre">nombre compelto</label>
                    <input type="text" id="nombre" name="nombre"
                    placeholder="Tu nombre completo" required>
                    <span class="error-msg" id="err-nombre">Ingresa tu nombre completo.</span>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email"
                    placeholder="correo@ejemplo.com" required>
                    <span class="error-msg" id="err-email">Ingresa un correo válido.</span>
                </div>
        
                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono"
                    placeholder="300 000 0000" required>
                </div>

                <div class="form-group">
                    <label for="ciudad">Ciudad</label>
                    <select id="ciudad" name="ciudad" required>
                        <option value="">-- Selecciona tu ciudad --</option>
                        <option value="bogota">Bogotá</option>
                        <option value="medellin">Medellín</option>
                        <option value="cali">Cali</option>
                        <option value="barranquilla">Barranquilla</option>
                        <option value="otra">Otra</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password"
                    placeholder="Mínimo 8 caracteres" required>
                    <span class="error-msg" id="err-pass">La contraseña debe tener mínimo 8 caracteres.</span>
                </div>

                <div class="form-group">
                    <label for="confirmar">Confirmar contraseña</label>
                    <input type="password" id="confirmar" name="confirmar"
                    placeholder="Repite tu contraseña" required>
                    <span class="error-msg" id="err-confirmar">Las contraseñas no coinciden.</span>
                </div>

                <div class="form-group">
                    <label for="confirmar">Confirmar contraseña</label>
                    <input type="password" id="confirmar" name="confirmar"
                    placeholder="Repite tu contraseña" required>
                    <span class="error-msg" id="err-confirmar">Las contraseñas no coinciden.</span>
                </div>

                <button type="submit" class="btn-registro">Registrarse</button>
            </form>
            <div class="login-link">
                ¿Ya tienes cuenta? <a href="contacto.html">Inicia sesión</a>
             </div>
        </div>
    </main>

    <script>
        function validarFormulario() {
            let valido = true;

            document.querySelectorAll('.error-msg').forEach(e => e.style.display = 'none');
            
            const nombre = document.getElementById('nombre').value.trim();
            if (nombre.length < 3) {
                document.getElementById('err-nombre').style.display = 'block';
                valido = false;
            }
            const pass = document.getElementById('password').value;
            if (pass.length < 8) {
                document.getElementById('err-pass').style.display = 'block';
                valido = false;
            }
            const confirmar = document.getElementById('confirmar').value;
            if (pass !== confirmar) {
                document.getElementById('err-confirmar').style.display = 'block';
                valido = false;
            }

            return valido ;
        }
    </script>
</body>
</html>
