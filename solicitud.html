<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Solicitud de Impresión - JJSM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="menu container">
            <a href="index.html" class="logo">JJSM</a>
        </div>
    </header>

     <main class="container">
        <h2>Solicitud de Impresión 3D</h2>
        <form action="SolicitudServlet" method="post">
            <label for="cliente">Nombre del cliente:</label>
            <input type="text" id="cliente" name="cliente" required placeholder="Tu nombre">

            <label for="modelo">Modelo de impresora:</label>
            <select id="modelo" name="modelo">
                <option value="creality">Creality Ender 3</option>
                <option value="bambu">Bambu Lab X1</option>
                <option value="prusa">Prusa MK4</option>
            </select>

            <label for="material">Material:</label>
            <select id="material" name="material">
                <option value="pla">PLA</option>
                <option value="abs">ABS</option>
                <option value="petg">PETG</option>
                <option value="resina">Resina</option>
            </select>

            <label for="descripcion">Tipo de impresion:</label>
            <textarea id="descripcion" name="descripcion" rows="4"
                placeholder="Describe que solucitud de impresion vas hacer..."></textarea>

            <label for="archivo">Archivo del diseño (.stl):</label>
            <input type="file" id="archivo" name="archivo" accept=".stl">

            <button type="submit">Enviar Solicitud</button>
        </form>
    </main>
</body>
</html>
